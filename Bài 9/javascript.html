<body>
<!-- Internal -->
 <script>
    // In ra màn hình
    document.writeln("chào cả nhà yêu<br>");
    // khai báo biến
    var name = "Quanh Angg <br>";
    document.writeln(name);
    // name="Châu ngoo <br>";
    document.writeln(name);
    // kiểu dữ liệu Number
    var year=2026;
    document.writeln(year);
    // phép toán
    //cộng +
    var a=10;
    var b=3;
    var ketQua=0
    document.writeln("<br> kết quả của phép tính cộng : ")
    ketQua=a+b;
    document.writeln(ketQua);
    //trừ
      document.writeln("<br> kết quả của phép tính trừ : ")
    ketQua=a-b;
    document.writeln(ketQua);
    //nhân
      document.writeln("<br> kết quả của phép tính nhân : ")
    ketQua=a*b;
    document.writeln(ketQua);
    //chia
      document.writeln("<br> kết quả của phép chia : ")
    ketQua=a/b;
    document.writeln(ketQua);
    //chia lấy dư
      document.writeln("<br> kết quả của phép tính : ")
    ketQua=a%b;
    document.writeln(ketQua);

    //++
    document.writeln("<br> ");
    document.writeln(++a);
    //--
    document.writeln("<br> ");
    document.writeln(--a) ;
    //+=
    document.writeln("<br> ");
    document.writeln(b+=b);
    //-=
    document.writeln("<br> ");
    document.writeln(b-=a);
    // nối chuỗi
 document.writeln("<br> ");
    var ho = "Lương";
    document.writeln(ho+" "+name);
    //kiểm tra độ dài chuỗi
     document.writeln("<br> ");
    document.writeln(name.length);
    //ktra kiểu
     document.writeln("<br> ");
    document.writeln(typeof(a));
    //
     document.writeln("<br> ");
    var hoVaTen="Lương Quang Anh";
    document.writeln(hoVaTen.indexOf("Q"));
     document.writeln("<br> ");
    document.writeln(hoVaTen.includes("A"));
     document.writeln("<br> ");
    document.writeln(hoVaTen.startsWith("Quang"));
    document.writeln(hoVaTen.replace("Quang","Quanh"));
     document.writeln("<br> ");
    document.writeln(hoVaTen.toUpperCase());
      document.writeln("<br> ");
    document.writeln(hoVaTen.toLowerCase());
    

 </script>
