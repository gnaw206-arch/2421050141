<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 20%;
        }

        .khoi-1 {
            text-align: center;
            /* display: flex;
            justify-content: center; */
            /* background-color: aqua; */
        }
    </style>
</head>


<body>
    <div class="khoi-1">
        <h1 class="che-do">Chế độ sáng</h1>
        <img src="../ảnh/mattroi.png">
        <div class="chuc-nang">
            <button onclick="doiCheDO()">Đổi chế độ</button>
        </div>
    </div>
    <script>
        var cheDo=true
        function doiCheDO(){
            if(cheDo){
                document.getElementsByTagName("body")[0].style="background-color: black";
                document.getElementsByClassName("che-do")[0].style="color: white";
                document.getElementsByClassName("che-do")[0].innerHTML="Chế độ tối";
                document.getElementsByTagName("img")[0].src="../ảnh/mattrang.png";4
                cheDo=false;
            }
            else{
                document.getElementsByTagName("body")[0].style="background-color: white";
                document.getElementsByClassName("che-do")[0].style="color: black";
                document.getElementsByClassName("che-do")[0].innerHTML="Chế độ sáng";
                document.getElementsByTagName("img")[0].src="../ảnh/mattroi.png";
                cheDo=true;
            }
           
        }
    </script>
</body>


</html>
